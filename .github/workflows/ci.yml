name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          cache: true
      - name: Install dependencies
        run: deno ci
      - name: Run CI checks
        run: deno task ci

  # The same tests must also pass on Bun (Deno -> Bun migration,
  # wazootech/workspace#50). Bun floats on 1.x on purpose so a Bun regression
  # surfaces early. Format, lint and type check stay on Deno until the cutover.
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.x"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test
