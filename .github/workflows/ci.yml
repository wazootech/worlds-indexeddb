name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.x"
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      # Format, lint, type check, manifest drift check and tests.
      - name: Run CI checks
        run: bun run ci
      # jsr (pinned in devDependencies) bundles its own Deno-based publisher and
      # downloads it on first use, so this runner needs no Deno install.
      - name: Publish dry run (smoke)
        run: bun run publish:dry
